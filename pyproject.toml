[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gti-relay"
version = "0.1.0"
description = "Minimal async relay client for the Google Threat Intelligence Agentic API (no LLM of its own)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
chat = ["fastapi>=0.110", "uvicorn>=0.29", "google-api-python-client>=2.100", "google-auth>=2.25", "requests>=2.31"]
slack = ["fastapi>=0.110", "uvicorn>=0.29", "slack-bolt>=1.18", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["gti_relay*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
